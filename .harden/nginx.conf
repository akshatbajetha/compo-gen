limit_req_zone $binary_remote_addr zone=heal_rl:10m rate=10r/s;

server {
    limit_req zone=heal_rl burst=20 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    listen 8080;
    location / {
        proxy_pass http://app;
    }
}
